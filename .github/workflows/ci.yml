name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    # JST 11:00 (UTC 02:00), 月-金
    - cron: "0 2 * * 1-5"

jobs:
  ci:
    name: CI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (pulse)
            os: ubuntu-24.04
            cargo-flags: ""
            audio-server: pulse
          - name: Ubuntu (pipewire)
            os: ubuntu-24.04
            cargo-flags: "--no-default-features --features default-pipewire"
            audio-server: pipewire
          - name: Ubuntu ARM (pulse)
            os: ubuntu-24.04-arm
            cargo-flags: ""
            audio-server: pulse
          - name: macOS
            os: macos-26
            cargo-flags: ""
            audio-server: none
          - name: Windows
            os: windows-2025-vs2026
            cargo-flags: ""
            audio-server: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: "1.93"
      - name: Install Linux dependencies (pulse)
        if: runner.os == 'Linux' && !contains(matrix.cargo-flags, 'pipewire')
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libclang-dev pulseaudio pulseaudio-utils
      - name: Install Linux dependencies (pipewire)
        if: runner.os == 'Linux' && contains(matrix.cargo-flags, 'pipewire')
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pipewire
      - run: cargo fmt --all --check
      - run: cargo check --workspace ${{ matrix.cargo-flags }}
      - name: Run cargo test (Linux with audio server)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/audio-runtime"
          export PIPEWIRE_RUNTIME_DIR="$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          cleanup() {
            if [ -n "${pulse_pid:-}" ]; then kill "$pulse_pid" 2>/dev/null || true; fi
            if [ -n "${pipewire_pid:-}" ]; then kill "$pipewire_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          if [ "${{ matrix.audio-server }}" = "pulse" ]; then
            # PulseAudio サーバをフォアグラウンドで起動する
            pulseaudio --daemonize=no --exit-idle-time=-1 -n --load=module-native-protocol-unix >"$RUNNER_TEMP/pulseaudio.log" 2>&1 &
            pulse_pid=$!
            # サーバが応答するまで待つ
            ready=0
            for _ in $(seq 1 10); do
              if pactl info >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "PulseAudio did not become ready" >&2
              if [ -f "$RUNNER_TEMP/pulseaudio.log" ]; then
                cat "$RUNNER_TEMP/pulseaudio.log" >&2
              fi
              exit 1
            fi
          else
            # テストが接続する PipeWire サーバを起動する
            pipewire >"$RUNNER_TEMP/pipewire.log" 2>&1 &
            pipewire_pid=$!
            # PipeWire のコアに接続できるまで待つ
            ready=0
            for _ in $(seq 1 10); do
              if pw-cli info 0 >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "PipeWire did not become ready" >&2
              cat "$RUNNER_TEMP/pipewire.log" >&2
              exit 1
            fi
          fi

          set +e
          timeout 300 cargo test --workspace ${{ matrix.cargo-flags }}
          status=$?
          set -e

          exit "$status"
      - name: Run cargo test (non-Linux)
        if: runner.os != 'Linux'
        run: cargo test --workspace ${{ matrix.cargo-flags }}
      - run: cargo clippy --workspace ${{ matrix.cargo-flags }} -- -D warnings

  device-test:
    name: Device Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: [self-hosted, X64, N150, Windows]
          - name: Linux
            runner: [self-hosted, Linux, X64, NVIDIA-Video-Codec-SDK]
          - name: macOS
            runner: [self-hosted, macOS, ARM64, Apple-M1]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Add cargo to PATH (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Set audio environment (Linux)
        if: runner.os == 'Linux'
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> $GITHUB_ENV
      - name: Add cargo to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo %USERPROFILE%\.cargo\bin>> "%GITHUB_PATH%"
      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - run: cargo test --workspace
      - name: Run device_list
        run: >
          cargo run --example device_list | jq -e
          '.device_count > 0
          and .device_count == (.devices | length)
          and (.devices | all(.name | length > 0))
          and (.devices | all(.unique_id | length > 0))
          and (.devices | all(.channels > 0 and .sample_rate > 0))'
      - name: Run device_info
        run: >
          cargo run --example device_info | jq -e
          '.statistics.device_count > 0
          and .statistics.device_count == (.devices | length)
          and .statistics.input_count + .statistics.output_count == .statistics.device_count
          and (.devices | all(.name | length > 0))
          and (.devices | all(.unique_id | length > 0))
          and (.devices | all(.channels > 0 and .sample_rate > 0))'

  slack_notify:
    needs: [ci, device-test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
