name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    # JST 11:00 (UTC 02:00), 月-金
    - cron: "0 2 * * 1-5"

jobs:
  ci:
    name: CI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (pulse)
            os: ubuntu-24.04
            cargo-flags: ""
            virtual-audio: pulse
          - name: Ubuntu (pipewire)
            os: ubuntu-24.04
            cargo-flags: "--no-default-features --features default-pipewire"
            virtual-audio: pipewire
          - name: Ubuntu ARM (pulse)
            os: ubuntu-24.04-arm
            cargo-flags: ""
            virtual-audio: pulse
          - name: macOS
            os: macos-26
            cargo-flags: ""
            virtual-audio: none
          - name: Windows
            os: windows-2025-vs2026
            cargo-flags: ""
            virtual-audio: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: "1.93"
      - name: Install Linux dependencies (pulse)
        if: runner.os == 'Linux' && !contains(matrix.cargo-flags, 'pipewire')
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libclang-dev pulseaudio pulseaudio-utils
      - name: Install Linux dependencies (pipewire)
        if: runner.os == 'Linux' && contains(matrix.cargo-flags, 'pipewire')
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pipewire wireplumber
      - run: cargo fmt --all --check
      - run: cargo check --workspace ${{ matrix.cargo-flags }}
      - name: Run cargo test (Linux with virtual audio)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/audio-runtime"
          export PIPEWIRE_RUNTIME_DIR="$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          if [ "${{ matrix.virtual-audio }}" = "pulse" ]; then
            # PULSE_SERVER が設定されていると pulseaudio が自分で起動しなくなる
            unset PULSE_SERVER
            pulseaudio --start --exit-idle-time=-1
            export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
            sleep 1
            pactl load-module module-null-sink sink_name=ci_dummy_sink rate=48000 channels=2
            pactl load-module module-virtual-source source_name=ci_dummy_source master=ci_dummy_sink.monitor
            pactl set-default-sink ci_dummy_sink
            pactl set-default-source ci_dummy_source
            pacat --playback --raw --format=s16le --rate=48000 --channels=2 --device=ci_dummy_sink < /dev/zero >/dev/null 2>&1 &
            feeder_pid=$!
            sleep 1
          else
            pipewire >"$RUNNER_TEMP/pipewire.log" 2>&1 &
            pipewire_pid=$!
            wireplumber >"$RUNNER_TEMP/wireplumber.log" 2>&1 &
            wireplumber_pid=$!
            sleep 2
            pw-cli create-node adapter '{ factory.name=support.null-audio-sink node.name=ci_dummy_sink media.class=Audio/Sink object.linger=true audio.position=[FL,FR] }'
            pw-cli create-node adapter '{ factory.name=support.null-audio-sink node.name=ci_dummy_source media.class=Audio/Source/Virtual object.linger=true audio.position=[FL,FR] }'
            sleep 1
          fi

          set +e
          cargo test --workspace ${{ matrix.cargo-flags }}
          status=$?
          set -e

          if [ -n "${feeder_pid:-}" ]; then kill "$feeder_pid" 2>/dev/null || true; fi
          if [ -n "${wireplumber_pid:-}" ]; then kill "$wireplumber_pid" 2>/dev/null || true; fi
          if [ -n "${pipewire_pid:-}" ]; then kill "$pipewire_pid" 2>/dev/null || true; fi
          if [ "${{ matrix.virtual-audio }}" = "pulse" ]; then pulseaudio --kill 2>/dev/null || true; fi
          exit "$status"
      - name: Run cargo test (non-Linux)
        if: runner.os != 'Linux'
        run: cargo test --workspace ${{ matrix.cargo-flags }}
      - run: cargo clippy --workspace ${{ matrix.cargo-flags }} -- -D warnings

  device-test:
    name: Device Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: [self-hosted, X64, N150, Windows]
          - name: Linux
            runner: [self-hosted, Linux, X64, NVIDIA-Video-Codec-SDK]
          - name: macOS
            runner: [self-hosted, macOS, ARM64, Apple-M1]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Add cargo to PATH (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Set audio environment (Linux)
        if: runner.os == 'Linux'
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> $GITHUB_ENV
      - name: Add cargo to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo %USERPROFILE%\.cargo\bin>> "%GITHUB_PATH%"
      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - run: cargo test --workspace
      - name: Run device_list
        run: >
          cargo run --example device_list | jq -e
          '.device_count > 0
          and .device_count == (.devices | length)
          and (.devices | all(.name | length > 0))
          and (.devices | all(.unique_id | length > 0))
          and (.devices | all(.channels > 0 and .sample_rate > 0))'
      - name: Run device_info
        run: >
          cargo run --example device_info | jq -e
          '.statistics.device_count > 0
          and .statistics.device_count == (.devices | length)
          and .statistics.input_count + .statistics.output_count == .statistics.device_count
          and (.devices | all(.name | length > 0))
          and (.devices | all(.unique_id | length > 0))
          and (.devices | all(.channels > 0 and .sample_rate > 0))'

  slack_notify:
    needs: [ci, device-test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
