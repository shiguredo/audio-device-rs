[package]
name = "shiguredo_audio_device"
version = "2026.1.0-canary.3"
edition = "2024"
rust-version = "1.88"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "Cross-platform audio device library"
homepage = "https://github.com/shiguredo/audio-device-rs"
repository = "https://github.com/shiguredo/audio-device-rs"
readme = "README.md"
build = "build.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = ["pulse"]
pulse = []
pipewire = []

[workspace]
members = [".", "pbt"]

[dev-dependencies]
nojson = "0.3"

[build-dependencies]
bindgen = "0.72"
cc = "1"
pkg-config = "0.3"
