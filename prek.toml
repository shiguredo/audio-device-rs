fail_fast = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "tombi-fmt",
    name = "tombi fmt",
    entry = "tombi format --check",
    language = "system",
    types = ["toml"],
    # Cargo.lock は cargo が独自に再生成するため対象外
    exclude = { glob = ["Cargo.lock"] },
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "tombi-lint",
    name = "tombi lint",
    entry = "tombi lint",
    language = "system",
    types = ["toml"],
    # Cargo.lock は cargo が独自に再生成するため対象外
    exclude = { glob = ["Cargo.lock"] },
    pass_filenames = false,
    priority = 5,
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "cargo-test",
    name = "cargo test",
    entry = "cargo test --workspace",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 30,
  },
]
