[package]
name = "shiguredo_audio_device-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
doc = false
name = "audio_frame_as_s16"
path = "fuzz_targets/audio_frame_as_s16.rs"
test = false

[[bin]]
doc = false
name = "playback_frame_from_s16"
path = "fuzz_targets/playback_frame_from_s16.rs"
test = false

[[bin]]
doc = false
name = "playback_frame_from_f32"
path = "fuzz_targets/playback_frame_from_f32.rs"
test = false

[dependencies]
# 任意バイト列を構造体へ変換する derive マクロ
arbitrary = { version = "1.4", features = ["derive"] }
# libFuzzer を用いたカバレッジ誘導型 Fuzzing のランタイム
libfuzzer-sys = "0.4"

# Fuzzing 対象となる公開 API
[dependencies.shiguredo_audio_device]
path = ".."
default-features = false
